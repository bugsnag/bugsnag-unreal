agents:
  queue: macos

steps:
  - label: 'Append Unreal 5.7 Pipeline'
    timeout_in_minutes: 2
    commands:
      - buildkite-agent pipeline upload .buildkite/unreal.5.7.yml

  - label: 'Conditionally trigger full set of tests'
    timeout_in_minutes: 2
    command: sh -c .buildkite/pipeline_trigger.sh
